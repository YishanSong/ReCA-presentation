<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>ReCA · Academic Slide Presentation</title>
<style>
* { box-sizing: border-box; }
html, body { height: 100%; width: 100%; margin: 0; overflow: hidden; }
body { background: #e5ebf2; }
#deck {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 1600px;
  height: 900px;
  overflow: hidden;
  transform-origin: center;
  background: #fff;
  box-shadow: 0 18px 65px rgba(24, 53, 85, 0.12);
}
.slide {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
  visibility: hidden;
  pointer-events: none;
}
.slide.active { visibility: visible; pointer-events: auto; }
@media print {
  html, body { overflow: visible; width: 1600px; height: auto; background: #fff; }
  #deck { position: static; transform: none !important; box-shadow: none; height: auto; overflow: visible; }
  .slide { visibility: visible; display: block; position: relative; width: 1600px; height: 900px; break-after: page; page-break-after: always; }
  @page { size: 1600px 900px; margin: 0; }
}
</style>
</head>
<body>
<main id="deck" role="group" aria-label="ReCA slide presentation">
  <!-- Slide content and titles are maintained in the individual pages. -->
  <iframe class="slide active" src="slides/slide-01.html" title="ReCA slide 1" aria-hidden="false"></iframe>
  <iframe class="slide" src="slides/slide-02.html" title="ReCA slide 2" aria-hidden="true" inert></iframe>
  <iframe class="slide" src="slides/slide-03.html" title="ReCA slide 3" aria-hidden="true" inert></iframe>
  <iframe class="slide" src="slides/slide-04.html" title="ReCA slide 4" aria-hidden="true" inert></iframe>
  <iframe class="slide" src="slides/slide-05.html" title="ReCA slide 5" aria-hidden="true" inert></iframe>
  <iframe class="slide" src="slides/slide-06.html" title="ReCA slide 6" aria-hidden="true" inert></iframe>
  <iframe class="slide" src="slides/slide-07.html" title="ReCA slide 7" aria-hidden="true" inert></iframe>
  <iframe class="slide" src="slides/slide-08.html" title="ReCA slide 8" aria-hidden="true" inert></iframe>
  <iframe class="slide" src="slides/slide-09.html" title="ReCA slide 9" aria-hidden="true" inert></iframe>
  <iframe class="slide" src="slides/slide-10.html" title="ReCA slide 10" aria-hidden="true" inert></iframe>
  <!-- The former slide 11 is merged into slide 10; its file is retained. -->
  <iframe class="slide" src="slides/slide-12.html" title="ReCA slide 12" aria-hidden="true" inert></iframe>
  <iframe class="slide" src="slides/slide-13.html" title="ReCA slide 13" aria-hidden="true" inert></iframe>
  <iframe class="slide" src="slides/slide-14.html" title="ReCA slide 14" aria-hidden="true" inert></iframe>
  <iframe class="slide" src="slides/slide-15.html" title="ReCA slide 15" aria-hidden="true" inert></iframe>
  <iframe class="slide" src="slides/slide-16.html" title="ReCA slide 16" aria-hidden="true" inert></iframe>
  <iframe class="slide" src="slides/slide-17.html" title="ReCA slide 17" aria-hidden="true" inert></iframe>
  <iframe class="slide" src="slides/slide-18.html" title="ReCA slide 18" aria-hidden="true" inert></iframe>
  <iframe class="slide" src="slides/slide-19.html" title="ReCA slide 19" aria-hidden="true" inert></iframe>
  <iframe class="slide" src="slides/slide-20.html" title="ReCA slide 20" aria-hidden="true" inert></iframe>
  <iframe class="slide" src="slides/slide-21.html" title="ReCA slide 21" aria-hidden="true" inert></iframe>
  <iframe class="slide" src="slides/slide-22.html" title="ReCA slide 22" aria-hidden="true" inert></iframe>
</main>
<script>
(function () {
  'use strict';
  const deck = document.getElementById('deck');
  const slides = Array.from(deck.querySelectorAll('.slide'));
  let current = 0;

  function resize() {
    const scale = Math.min(window.innerWidth / 1600, window.innerHeight / 900);
    deck.style.transform = `translate(-50%, -50%) scale(${scale})`;
  }

  function setSlideVideoActive(slide, active) {
    try {
      const controller = slide.contentWindow.ReCASlideVideo;
      if (controller) controller.setActive(active);
    } catch (error) {
      // Same-origin HTTP preview is required for iframe lifecycle control.
    }
  }

  function showSlide(next) {
    if (!slides.length) return;
    const index = Math.min(slides.length - 1, Math.max(0, next));
    if (index === current) {
      deck.setAttribute('aria-label', `ReCA slide ${current + 1} of ${slides.length}`);
      window.focus();
      return;
    }
    const previous = slides[current];
    setSlideVideoActive(previous, false);
    previous.classList.remove('active');
    previous.setAttribute('aria-hidden', 'true');
    previous.inert = true;
    current = index;
    const active = slides[current];
    active.classList.add('active');
    active.setAttribute('aria-hidden', 'false');
    active.inert = false;
    setSlideVideoActive(active, true);
    deck.setAttribute('aria-label', `ReCA slide ${current + 1} of ${slides.length}`);
    window.focus();
  }

  function onKeyDown(event) {
    if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey) return;
    const target = event.target;
    if (target && (target.isContentEditable || target.closest('input, textarea, select, button, a, [role="textbox"]'))) return;
    let next;
    if (event.key === 'ArrowRight' || event.key === 'PageDown' || event.key === ' ') next = current + 1;
    else if (event.key === 'ArrowLeft' || event.key === 'PageUp') next = current - 1;
    else if (event.key === 'Home') next = 0;
    else if (event.key === 'End') next = slides.length - 1;
    else return;
    event.preventDefault();
    showSlide(next);
  }

  slides.forEach(function (slide, index) {
    slide.addEventListener('load', function () {
      // Keyboard events inside an iframe do not bubble to its parent window.
      try {
        const page = slide.contentDocument;
        if (!page) return;
        setSlideVideoActive(slide, slide.classList.contains('active'));
        page.addEventListener('keydown', onKeyDown);
        const title = page.querySelector('.slide-title');
        if (title) slide.title = title.textContent.trim();
        // Source filenames stay stable when a page is merged or archived.
        const number = page.querySelector('.slide-number');
        if (number) number.textContent = String(index + 1);
      } catch (error) {
        // Some browsers isolate file:// pages; serve over HTTP for iframe keys.
      }
    });
  });
  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('resize', resize);
  resize();
  showSlide(0);
})();
</script>
</body>
</html>
